name: preview
# Publishes a test build to https://qqqq2026.github.io/blockracers-website-preview/
# on every push to a non-main branch, or by hand (Actions > preview > Run workflow).
# Needs repo secret PREVIEW_TOKEN: fine-grained token, only repo qqqq2026/blockracers-website-preview,
# permission Contents: Read and write. Never touches production, the custom domain or DNS.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # publieke anon key (mag openbaar), repo > Settings > Variables > SUPABASE_ANON_KEY
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PREVIEW_BASE: /blockracers-website-preview/
      - name: Publish to preview repo
        env:
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TOKEN" ]; then
            echo "::warning::PREVIEW_TOKEN is not set, skipping publish. Build passed."
            exit 0
          fi
          cd dist
          touch .nojekyll
          printf '# blockracers-website-preview\n\nTestomgeving, niet de live site. Gebouwd uit %s@%s.\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" > README.md
          git init -q -b gh-pages
          git add -A
          git -c user.name="preview-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Preview of $GITHUB_REF_NAME ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${PREVIEW_TOKEN}@github.com/qqqq2026/blockracers-website-preview.git" gh-pages
          echo "Preview: https://qqqq2026.github.io/blockracers-website-preview/" >> "$GITHUB_STEP_SUMMARY"
